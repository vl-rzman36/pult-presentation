<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws: wss:"><title>Пульт на телефоне</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#131b25;color:#f2f5f5;font-family:Segoe UI,Arial,sans-serif;display:flex;flex-direction:column;padding:22px;gap:20px}header{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;font-weight:700}#status{font-size:.82rem;color:#8acdbf}main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}button{border:1px solid #526677;border-radius:16px;background:#26394a;color:#fff;font:inherit;font-weight:700;min-height:120px;font-size:1.25rem;touch-action:manipulation}button:active{background:#4d8b87}#prev,#next{font-size:3rem}#show{background:#72c7b7;color:#11242b;grid-column:1/-1;min-height:85px}#hold{grid-column:1/-1;min-height:75px}footer{text-align:center;color:#a8b6c0;font-size:.85rem}</style></head><body><header><span>Пульт презентаций</span><span id="status">Подключение…</span></header><main><button id="prev" data-action="prev" aria-label="Предыдущий слайд">←</button><button id="next" data-action="next" aria-label="Следующий слайд">→</button><button id="show" data-action="show">Показать выбранный PDF</button><button id="hold" data-action="placeholder">Заглушка</button></main><footer>Пульт работает, пока открыт на ноутбуке</footer><script src="remote.js"></script></body></html>
